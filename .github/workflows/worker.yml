name: Publicar repassador (Cloudflare Worker)

on:
  push:
    branches: [main, claude/sharp-darwin-q8qulr]
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Opcionais: chaves grátis dos catálogos de código de barras (README).
      COSMOS_TOKEN: ${{ secrets.COSMOS_TOKEN }}
      KODEBAR_KEY: ${{ secrets.KODEBAR_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Verificar se os segredos existem
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::Faltam os segredos CLOUDFLARE_API_TOKEN e/ou CLOUDFLARE_ACCOUNT_ID em Settings > Secrets and variables > Actions."
            exit 1
          fi
      # Catálogo próprio (worker/src/catalog.js): cria o banco D1 grátis na
      # primeira vez e liga no Worker. Se a chave da Cloudflare não tiver
      # permissão de D1, o Worker é publicado sem o catálogo, como antes.
      - name: Banco do catálogo (D1)
        id: d1
        continue-on-error: true
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          NAME=keepinventory-catalogo
          find_id() { npx --yes wrangler d1 list --json | jq -r --arg n "$NAME" '.[] | select(.name == $n) | .uuid' | head -n1; }
          ID="$(find_id)"
          if [ -z "$ID" ]; then
            npx --yes wrangler d1 create "$NAME"
            ID="$(find_id)"
          fi
          if [ -z "$ID" ]; then echo "::warning::Não consegui criar o banco D1 do catálogo."; exit 1; fi
          printf '\n[[d1_databases]]\nbinding = "CATALOG"\ndatabase_name = "%s"\ndatabase_id = "%s"\n' "$NAME" "$ID" >> wrangler.toml
          echo "Catálogo ligado: $NAME ($ID)"
      - name: Avisar se o catálogo ficou de fora
        if: steps.d1.outcome == 'failure'
        run: echo "::warning::O Worker vai sem o catálogo próprio. A chave CLOUDFLARE_API_TOKEN precisa da permissão 'Account > D1 > Edit' (dash.cloudflare.com > My Profile > API Tokens > editar a chave)."
      - name: Publicar
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
      - name: Chaves dos catálogos de código de barras (se existirem)
        if: env.COSMOS_TOKEN != '' || env.KODEBAR_KEY != ''
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$COSMOS_TOKEN" ]; then printf '%s' "$COSMOS_TOKEN" | npx --yes wrangler secret put COSMOS_TOKEN; fi
          if [ -n "$KODEBAR_KEY" ]; then printf '%s' "$KODEBAR_KEY" | npx --yes wrangler secret put KODEBAR_KEY; fi
