name: Atualizar base de remédios

# A Anvisa publica a tabela CMED todo mês. Este workflow baixa a mais nova,
# refaz data/remedios/ e, se algo mudou, faz o commit e publica o site.
on:
  schedule:
    - cron: '17 9 12 * *'   # dia 12 de cada mês, 06:17 em Brasília
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: remedios
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Montar a base
        run: |
          pip install openpyxl
          python3 scripts/remedios.py
      - name: Salvar e publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/remedios && [ -z "$(git ls-files --others --exclude-standard data/remedios)" ]; then
            echo "A tabela não mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/remedios
          git commit -m "Base de remédios: tabela CMED de $(jq -r .data data/remedios/info.json)"
          git push
          # Push feito pelo próprio workflow não dispara outros workflows: publica à mão.
          gh workflow run pages.yml --ref "$GITHUB_REF_NAME"
